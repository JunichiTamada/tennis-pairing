name: Deploy Pages (root + v1 + v1-hsbk + v1-2courts + v2-preview)

on:
  push:
    branches: [ main, release/v1, release/v1-hsbk, v2, feature/round-8players ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Checkout main (for root & v2-preview)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            main/package-lock.json
            repo-v1/package-lock.json
            repo-v1-hsbk/package-lock.json
            repo-v1-2courts/package-lock.json

      - name: Prepare dist-all
        run: |
          rm -rf dist-all
          mkdir -p dist-all

      # ---- root ----
      - name: Install deps (root)
        working-directory: main
        run: npm ci

      - name: Add type deps (root)
        working-directory: main
        run: npm i -D @types/node

      - name: Build root (/tennis-pairing/)
        working-directory: main
        run: |
          npm run build -- --base=/tennis-pairing/ --outDir=dist-root
          rsync -a --delete dist-root/ ../dist-all/

      # ---- v2-preview ----
      - name: Build v2-preview (/tennis-pairing/v2-preview/)
        working-directory: main
        run: |
          npm run build -- --base=/tennis-pairing/v2-preview/ --outDir=dist-v2
          mkdir -p ../dist-all/v2-preview
          rsync -a --delete dist-v2/ ../dist-all/v2-preview/

      # ---- v1 ----
      - name: Checkout v1 (from release/v1)
        uses: actions/checkout@v4
        with:
          ref: release/v1
          path: repo-v1

      - name: Verify repo-v1 exists
        run: |
          test -d repo-v1 || (echo "ERROR: repo-v1 missing" && exit 1)

      - name: Install deps (v1)
        working-directory: repo-v1
        run: npm ci

      - name: Add type deps (v1)
        working-directory: repo-v1
        run: npm i -D @types/node

      - name: Build v1 (/tennis-pairing/v1/)
        working-directory: repo-v1
        run: |
          npm run build -- --base=/tennis-pairing/v1/ --outDir=dist-v1
          mkdir -p ../dist-all/v1
          rsync -a --delete dist-v1/ ../dist-all/v1/

      # ---- v1-hsbk ----
      - name: Checkout v1-hsbk (from release/v1-hsbk)
        uses: actions/checkout@v4
        with:
          ref: release/v1-hsbk
          path: repo-v1-hsbk

      - name: Verify repo-v1-hsbk exists
        run: |
          test -d repo-v1-hsbk || (echo "ERROR: repo-v1-hsbk missing" && exit 1)

      - name: Install deps (v1-hsbk)
        working-directory: repo-v1-hsbk
        run: npm ci

      - name: Add type deps (v1-hsbk)
        working-directory: repo-v1-hsbk
        run: npm i -D @types/node

      - name: Build v1-hsbk (/tennis-pairing/v1-hsbk/)
        working-directory: repo-v1-hsbk
        run: |
          npm run build -- --base=/tennis-pairing/v1-hsbk/ --outDir=dist-hsbk
          mkdir -p ../dist-all/v1-hsbk
          rsync -a --delete dist-hsbk/ ../dist-all/v1-hsbk/

      # ---- v1-2courts ----
      - name: Checkout v1-2courts (from feature/round-8players)
        uses: actions/checkout@v4
        with:
          ref: feature/round-8players
          path: repo-v1-2courts

      - name: Verify repo-v1-2courts exists
        run: |
          test -d repo-v1-2courts || (echo "ERROR: repo-v1-2courts missing" && exit 1)

      - name: Install deps (v1-2courts)
        working-directory: repo-v1-2courts
        run: npm ci

      - name: Add type deps (v1-2courts)
        working-directory: repo-v1-2courts
        run: npm i -D @types/node

      - name: Build v1-2courts (/tennis-pairing/v1-2courts/)
        working-directory: repo-v1-2courts
        run: |
          npm run build -- --base=/tennis-pairing/v1-2courts/ --outDir=dist-2courts
          mkdir -p ../dist-all/v1-2courts
          rsync -a --delete dist-2courts/ ../dist-all/v1-2courts/

      # ---- SPA 404 fallback ----
      - name: Add SPA 404 fallbacks
        run: |
          cp dist-all/index.html dist-all/404.html || true
          cp dist-all/v1/index.html dist-all/v1/404.html || true
          cp dist-all/v1-hsbk/index.html dist-all/v1-hsbk/404.html || true
          cp dist-all/v1-2courts/index.html dist-all/v1-2courts/404.html || true
          cp dist-all/v2-preview/index.html dist-all/v2-preview/404.html || true

      # ---- Verify artifacts ----
      - name: Verify artifacts exists
        run: |
          test -f dist-all/index.html || exit 1
          test -f dist-all/v1/index.html || exit 1
          test -f dist-all/v1-hsbk/index.html || exit 1
          test -f dist-all/v1-2courts/index.html || exit 1
          test -f dist-all/v2-preview/index.html || exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-all

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4